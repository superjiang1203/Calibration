<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相机采集</title>
<style>
body { font: 14px system-ui, sans-serif; background: #15212c; color: #ecf2f7; margin: 12px; }
h1 { margin: 0 0 8px; font-size: 18px; }
button { padding: 4px 8px; margin-right: 4px; }
img { display: block; margin: 0 auto; max-width: 100%; max-height: 75vh; }
#previews { display: grid; grid-template-columns: minmax(0,1fr); gap: 8px; min-height: 12rem; padding: 8px; border: 1px solid #3a4a5c; background: #101923; }
#previews.paired { grid-template-columns: repeat(2,minmax(0,1fr)); }
#previews section { min-width: 0; text-align: center; align-self: start; }
#previews section + section { border-left: 1px solid #293544; padding-left: 8px; }
#previews .frame-wait { color: #a9bacb; min-height: 5rem; margin: 0; }
#previewWait { grid-column: 1 / -1; }
#previews h3 { margin: 0 0 8px; font-size: 15px; }
#previewWait { color: #a9bacb; }
[hidden] { display: none; }
#cameraLog { max-height: 15rem; overflow: auto; background: #101923; padding: 12px; white-space: pre-wrap; }
#devices { display: inline-flex; flex-wrap: wrap; gap: 6px 14px; }
#devices p { margin: 0; }
#cameraControls label { display: inline-block; margin: 3px 10px 3px 0; }
#cameraControls input { width: 7em; }
details { margin: 6px 0; }
</style>
<h1 id="captureTitle">相机采集</h1>
<div id="devices"></div>
<div id="singleConnection">
<button id="connect">连接相机</button>
<button id="disconnect" disabled>断开相机</button>
</div>
<span id="cameraState" role="status">已断开</span>
<button id="save" disabled>采集一组（空格）</button>
<button id="video" hidden disabled>开始录像</button>
<button id="nextGroup" hidden disabled>下一组（N）</button>
<button id="finish">结束采集</button>
<p id="status" role="status">点击「连接相机」开始预览。</p>
<p id="groupStatus" role="status" hidden></p>
<p id="markerSaveFeedback" role="status" hidden></p>
<p id="markerRanges" hidden></p>
<p id="previewTiming" hidden></p>
<div id="previews" aria-label="实时相机画面">
    <p id="previewWait" role="status">等待连接相机…</p>
    <section id="primaryPreview" hidden><h3></h3><img id="preview" alt="标定相机预览"></section>
</div>
<details><summary>曝光和增益</summary><div id="cameraControls"></div><p id="settingFeedback" role="status"></p></details>
<h2>相机日志</h2>
<pre id="cameraLog" tabindex="0">等待连接相机…</pre>
<script src="/image_zoom.js"></script>
<script>
const previews = document.querySelector('#previews');
const primaryPreview = document.querySelector('#primaryPreview');
const previewWait = document.querySelector('#previewWait');
const cameraImages = new Map();
const info = document.querySelector('#status');
const save = document.querySelector('#save');
const video = document.querySelector('#video');
let videoRecording = false;
const nextGroup = document.querySelector('#nextGroup');
const groupStatus = document.querySelector('#groupStatus');
const markerSaveFeedback = document.querySelector('#markerSaveFeedback');
const markerRanges = document.querySelector('#markerRanges');
const previewTiming = document.querySelector('#previewTiming');
const finish = document.querySelector('#finish');
const connect = document.querySelector('#connect');
const disconnect = document.querySelector('#disconnect');
const log = document.querySelector('#cameraLog');
const cameraControls = document.querySelector('#cameraControls');
const stateLabel = document.querySelector('#cameraState');
let busy = false, done = false;
let settingLocal = false, settingRemote = false;
let controlSignature = '';
let deviceSignature = '';
const inputs = new Map();
const settingFeedback = document.querySelector('#settingFeedback');
const settingLocked = () => settingLocal || settingRemote;
function disableCameraActions() {
    for (const button of [save, video, nextGroup, finish, connect, disconnect, ...document.querySelectorAll('#devices button')]) {
        button.disabled = true;
    }
    for (const input of inputs.values()) input.disabled = true;
}
async function control(action, payload) {
    if (busy || done || settingLocked() || (action === 'save' && save.disabled)) return;
    busy = true;
    const setting = action === 'settings';
    if (setting) {
        settingLocal = true;
        settingFeedback.textContent = '正在调整，等待相机回读…';
        disableCameraActions();
    }
    try {
        const response = await fetch('/' + action, {
            method: 'POST', signal: AbortSignal.timeout(setting ? 21000 : 4000),
            ...(payload && {headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)})
        });
        if (setting) {
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || '相机未返回参数');
            renderControls(result.settings, true);
            const current = result.settings[payload.label][payload.field].cur;
            settingFeedback.textContent = '调整成功，设备回读值为 ' + current + '。';
            return;
        }
        if (!response.ok) throw new Error('HTTP ' + response.status);
        if (action.startsWith('video/')) {
            info.textContent = action === 'video/start' ? '正在开启录像…' : '正在保存 MP4…';
            return;
        }
        done = action === 'finish';
        if (action === 'connect' || action === 'disconnect' || action === 'group/next') {
            info.textContent = '请求已提交，处理结果见相机日志。';
            return;
        }
        info.textContent = done ? '正在结束采集。请在终端查看结果。' : '已请求采集。保存结果见终端和画面计数。';
    } catch (error) {
        (setting ? settingFeedback : info).textContent = '请求失败：' + error.message;
    } finally {
        busy = false;
        if (setting) settingLocal = false;
        if (done) save.disabled = video.disabled = nextGroup.disabled = finish.disabled = connect.disabled = disconnect.disabled = true;
    }
}
save.onclick = () => control('save');
video.onclick = () => control(videoRecording ? 'video/stop' : 'video/start');
nextGroup.onclick = () => control('group/next');
finish.onclick = () => control('finish');
connect.onclick = () => control('connect');
disconnect.onclick = () => control('disconnect');
document.addEventListener('keydown', event => {
    if (event.code === 'KeyN' && !event.repeat && !nextGroup.disabled && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
        control('group/next');
    }
    if (event.code === 'Space' && !event.repeat && !['BUTTON', 'INPUT'].includes(document.activeElement?.tagName)) {
        event.preventDefault();
        control('save');
    }
});
function clearPreview(stream) {
    if (stream.active) stream.generation += 1;
    stream.active = false;
    stream.shown.length = 0;
    stream.image.removeAttribute('src');
    if (stream.objectUrl) URL.revokeObjectURL(stream.objectUrl);
    stream.objectUrl = null;
    stream.revision = '';
    stream.pending = false;
}
async function requestPreview(name, stream) {
    if (!stream.active || stream.pending) return;
    const generation = stream.generation;
    const query = new URLSearchParams({camera: name, after: stream.revision || ''});
    stream.pending = true;
    let loading = false;
    try {
        const response = await fetch('/frame.jpg?' + query, {
            cache: 'no-store', signal: AbortSignal.timeout(3000)
        });
        if (response.status === 204) return;
        if (!response.ok) throw new Error('preview');
        const blob = await response.blob();
        if (!stream.active || stream.generation !== generation || cameraImages.get(name) !== stream) return;
        stream.revision = response.headers.get('X-Frame-Revision');
        if (stream.objectUrl) URL.revokeObjectURL(stream.objectUrl);
        stream.objectUrl = URL.createObjectURL(blob);
        loading = true;
        stream.image.src = stream.objectUrl;
    } catch {
        if (stream.active) info.textContent = '实时画面读取失败，正在重试。';
    } finally {
        if (!loading && stream.generation === generation) stream.pending = false;
    }
}
setInterval(() => {
    if (done || document.hidden) return;
    for (const [name, stream] of cameraImages) requestPreview(name, stream);
}, 1000 / 30);

function renderPreviews(state) {
    const active = Array.isArray(state.cameras) ? state.cameras : (state.has_frame ? [''] : []);
    const names = state.camera_slots?.length === 2 ? state.camera_slots : active;
    previews.classList.toggle('paired', names.length === 2);
    previewWait.hidden = names.length > 0;
    previewWait.textContent = state.state === 'failed' ? '相机连接失败，原因见下方相机日志。' :
        state.state === 'connected' ? '已连接，等待相机首帧…' : '点击「连接相机」开始预览。';
    for (const [name, stream] of cameraImages) {
        if (names.includes(name)) continue;
        const {panel, dispose} = stream;
        clearPreview(stream);
        if (panel === primaryPreview) {
            panel.hidden = true;
            continue;
        }
        dispose?.();
        panel.remove();
        cameraImages.delete(name);
    }
    for (const name of names) {
        if (!cameraImages.has(name)) {
            const first = !cameraImages.size;
            const panel = first ? primaryPreview : document.createElement('section');
            const title = first ? panel.querySelector('h3') : document.createElement('h3');
            const image = first ? panel.querySelector('img') : document.createElement('img');
            title.textContent = name || '实时预览';
            image.alt = name || '实时相机预览';
            if (!first) {
                panel.append(title, image);
                previews.append(panel);
            }
            const waiting = document.createElement('p');
            waiting.className = 'frame-wait';
            waiting.textContent = '等待该相机画面';
            image.before(waiting);
            const stream = {panel, image, waiting, dispose: null, pending: false, shown: [], generation: 0};
            image.addEventListener('load', () => {
                stream.pending = false;
                if (!document.hidden && !image.hidden) stream.shown.push(performance.now());
                if (stream.dispose || typeof mountImageZoom !== 'function') return;
                try {
                    stream.dispose = mountImageZoom(image, image);
                } catch (error) {
                    console.warn('Preview zoom unavailable', error);
                }
            });
            image.addEventListener('error', () => {
                stream.pending = false;
                stream.revision = '';
                info.textContent = '实时画面读取失败，正在重试。';
            });
            cameraImages.set(name, stream);
        }
        const stream = cameraImages.get(name);
        stream.panel.hidden = false;
        stream.panel.style.order = names.indexOf(name);
        stream.waiting.hidden = active.includes(name);
        stream.image.hidden = !active.includes(name);
        if (active.includes(name)) stream.active = true;
        else clearPreview(stream);
    }
}
function renderControls(settings, connected) {
    const signature = JSON.stringify(Object.entries(settings).map(([label, values]) => [label, Object.keys(values)]));
    if (signature !== controlSignature) {
        controlSignature = signature;
        cameraControls.replaceChildren();
        inputs.clear();
        for (const [label, values] of Object.entries(settings)) {
            for (const field of Object.keys(values)) {
                const wrapper = document.createElement('label');
                const input = document.createElement('input');
                input.type = 'number';
                wrapper.append(label + (field === 'exposure_us' ? ' 曝光（µs） ' : ' 增益（dB） '), input);
                input.onchange = () => {
                    if (input.value !== '' && input.reportValidity()) control('settings', {label, field, value: input.valueAsNumber});
                };
                input.onkeydown = event => { if (event.key === 'Enter') input.blur(); };
                cameraControls.append(wrapper);
                inputs.set(JSON.stringify([label, field]), input);
            }
        }
    }
    for (const [key, input] of inputs) {
        const [label, field] = JSON.parse(key);
        const range = settings[label][field];
        input.min = range.min;
        input.max = range.max;
        input.step = 'any';
        input.disabled = settingLocked();
        if (!settingLocal && document.activeElement !== input) input.value = range.cur;
    }
    if (!inputs.size) cameraControls.textContent = connected ? '当前相机后端未提供实时曝光和增益调节。' : '';
}
function renderDevices(devices) {
    const entries = Object.entries(devices || {});
    document.querySelector('#singleConnection').hidden = entries.length > 0;
    const signature = JSON.stringify([entries, settingLocked()]);
    if (signature === deviceSignature) return;
    deviceSignature = signature;
    const container = document.querySelector('#devices');
    container.replaceChildren();
    for (const [device, status] of entries) {
        const row = document.createElement('p');
        const available = status === 'connected';
        const label = ({connected: '已连接', connecting: '正在连接', failed: '连接或取帧失败', disconnected: '未连接'})[status];
        row.textContent = device + ' · ' + label + ' ';
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = available ? '断开相机' : '连接相机';
        button.disabled = settingLocked() || status === 'connecting';
        button.onclick = () => control(available ? 'disconnect' : 'connect', {device});
        row.append(button);
        container.append(row);
    }
}
async function refresh() {
    if (done) return;
    try {
        const response = await fetch('/status', {cache: 'no-store', signal: AbortSignal.timeout(3000)});
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const state = await response.json();
        settingRemote = Boolean(state.settings_pending);
        document.querySelector('#captureTitle').textContent = document.title = state.title || '相机采集';
        renderDevices(state.devices);
        nextGroup.hidden = !state.group;
        nextGroup.disabled = !state.group?.ready;
        video.hidden = !state.video_enabled;
        videoRecording = Boolean(state.video_recording);
        const videoPending = Boolean(state.video_requested) !== videoRecording;
        video.textContent = videoPending ? (state.video_requested ? '正在开始录像…' : '正在保存录像…')
            : videoRecording ? '停止录像并保存 MP4' : '开始录像';
        video.disabled = videoPending || (!videoRecording && !state.can_save);
        save.textContent = state.group ? '保存一张（空格）' : '采集一组（空格）';
        finish.textContent = state.group
            ? (state.group.complete ? '结束采集并标定' : '保存进度并退出')
            : '结束采集';
        groupStatus.hidden = !state.group;
        const shot = state.marker_save_feedback;
        markerSaveFeedback.hidden = !state.group || !shot;
        markerSaveFeedback.textContent = shot?.message || '';
        markerRanges.hidden = !state.group || state.state !== 'connected';
        if (!markerRanges.hidden) {
            const ranges = state.marker_distances;
            const entries = Object.entries(ranges?.mm || {});
            const values = entries.map(([id, mm]) => `ID ${id} ${mm == null ? '—' : '≈ ' + Math.round(mm) + ' mm'}`);
            const hint = ranges?.status === 'board_unavailable' ? '请让完整棋盘进入画面'
                : !entries.length ? '等待检测到靶标码' : entries.some(([, mm]) => mm == null)
                    ? '— 表示需要更多有效视角或当前观测未通过检查' : '';
            markerRanges.textContent = ['码心到相机', ...values, hint].filter(Boolean).join(' · ');
        }
        if (state.group) {
            const g = state.group;
            const count = g.minimum_images ? `${g.images}/${g.minimum_images}` : g.images;
            groupStatus.textContent = `第 ${g.group} 组 · 达标 ${g.ready_groups}/${g.minimum_groups} 组 · 本组 ${count} 张有效图 · 已拍足 ${g.qualified.join('、') || '—'} · 共视码 ${g.bridge.join('、') || '—'} · 待覆盖 ${g.missing.join('、') || '—'}。`
                + (g.complete ? ' 覆盖完成，可以标定。' : g.ready ? ' 本组就绪，可切到下一组。' : ' 请继续移动相机采集。');
        }
        const connected = state.state === 'connected';
        stateLabel.textContent = ({disconnected:'已断开', connecting:'正在连接', connected:'已连接', disconnecting:'正在断开', failed:'连接失败'})[state.state];
        connect.disabled = connected || state.state === 'connecting' || state.state === 'disconnecting';
        disconnect.disabled = !connected;
        save.disabled = !(state.can_save ?? state.has_frame);
        finish.disabled = false;
        if (state.has_frame && state.can_save === false && Object.keys(state.devices || {}).length > 1) {
            info.textContent = '单路预览可用。双目采集需在同一采集轮次取得两路图像。';
        }
        renderControls(state.controls, connected);
        const lines = state.logs.map(entry => new Date(entry.time * 1000).toLocaleTimeString() + ' ' + entry.message).join('\n');
        if (lines && lines !== log.textContent) {
            const follow = log.scrollHeight - log.scrollTop - log.clientHeight <= 8;
            log.textContent = lines;
            if (follow) log.scrollTop = log.scrollHeight;
        }
        renderPreviews(state);
        const timing = state.preview_timing;
        previewTiming.hidden = !timing || !state.has_frame;
        if (!previewTiming.hidden) {
            const stream = cameraImages.get(state.cameras[0]);
            const now = performance.now();
            if (stream) stream.shown = stream.shown.filter(stamp => stamp >= now - 2000);
            const shown = stream?.shown || [];
            const displayed = shown.length > 1 && shown.at(-1) > shown[0]
                ? (shown.length - 1) * 1000 / (shown.at(-1) - shown[0]) : null;
            const metric = (value, unit) => value == null ? '—' : value.toFixed(1) + ' ' + unit;
            previewTiming.textContent = [
                '取帧频率 ' + metric(timing.acquisition_fps, 'fps'),
                '浏览器显示 ' + metric(displayed, 'fps'),
                '追踪耗时 ' + metric(timing.tracking_ms, 'ms'),
                '取帧后至预览就绪 ' + metric(timing.processing_ms, 'ms'),
            ].join(' · ');
        }
        if (settingLocked()) disableCameraActions();
    } catch (error) {
        stateLabel.textContent = '暂时无法读取采集状态';
        info.textContent = error.message;
        save.disabled = video.disabled = true;
    } finally {
        if (!done) setTimeout(refresh, 250);
    }
}
refresh();
</script>
</html>
