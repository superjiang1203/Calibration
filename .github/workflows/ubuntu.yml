name: Ubuntu 22.04

on: [push, pull_request]

jobs:
  offline-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-calibration.txt
      - run: python -m pip install -r requirements-calibration.txt
      - run: python python/scripts/calibrate.py --help
      - run: python -m unittest discover -s python/scripts/validation -p 'test_*.py' -v
        env:
          PYTHONPATH: python
      - run: python python/scripts/validation/self_check.py -v
